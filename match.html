<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المباراة</title>
  <style>
    body{font-family:'Cairo',sans-serif;background:#0d1117;color:#e6edf3;max-width:650px;margin:0 auto;padding:1rem}
    .sub-row{display:flex;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #30363d}
    .sub-min{color:#58a6ff;font-weight:bold}
    .sub-in{color:#4ade80}
    .sub-out{color:#ef4444}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const WORKER = 'https://football-worker.mahdijadir38.workers.dev';
    const params = new URLSearchParams(location.search);
    const matchId = params.get('id');
    const league = params.get('league') || '';

    async function load() {
      try {
        const res = await fetch(`${WORKER}/api/summary?matchId=${matchId}&league=${league}`);
        const data = await res.json();
        document.getElementById('root').innerHTML = `
          <h2>${data.homeTeam} vs ${data.awayTeam}</h2>
          <h3>النتيجة: ${data.homeScore} - ${data.awayScore}</h3>
          <h4>التبديلات (${data.subs?.length || 0}):</h4>
          ${(data.subs || []).map(s => `
            <div class="sub-row">
              <span class="sub-min">${s.minute || '??'}</span>
              <span class="sub-in">▲ ${s.playerIn}</span>
              <span class="sub-out">▼ ${s.playerOut}</span>
            </div>
          `).join('')}
          <h4>الأهداف (${data.goals?.length || 0}):</h4>
          ${(data.goals || []).map(g => `
            <div class="sub-row"><span class="sub-min">${g.minute}</span> ⚽ ${g.player} (${g.team})</div>
          `).join('')}
        `;
      } catch(e) {
        document.getElementById('root').innerHTML = 'خطأ: ' + e.message;
      }
    }
    load();
  </script>
</body>
</html>
