<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المباراة</title>
  <style>
    body{font-family:'Cairo',sans-serif;background:#0d1117;color:#e6edf3;max-width:650px;margin:0 auto;padding:1rem}
    .card{background:#161b22;border-radius:10px;padding:1rem;margin-bottom:1rem}
    .row{display:flex;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #30363d}
    .min{color:#58a6ff;font-weight:bold;min-width:50px}
    .green{color:#4ade80}
    .red{color:#ef4444}
    .yellow{color:#f59e0b}
  </style>
</head>
<body>
  <div id="root">جارٍ التحميل...</div>
  <script>
    const WORKER = 'https://football-worker.mahdijadir38.workers.dev';
    const params = new URLSearchParams(location.search);
    const matchId = params.get('id');
    const league = params.get('league') || '';

    async function load() {
      try {
        const res = await fetch(`${WORKER}/api/summary?matchId=${matchId}&league=${league}`);
        const data = await res.json();
        console.log('بيانات المباراة:', data);
        
        document.getElementById('root').innerHTML = `
          <div class="card">
            <h2>${data.homeTeam} 🆚 ${data.awayTeam}</h2>
            <h3>النتيجة: ${data.homeScore} - ${data.awayScore}</h3>
            <div style="color:#8b949e;font-size:0.8rem">${data.leagueName || ''}</div>
          </div>
          
          <div class="card">
            <h4>⚽ الأهداف (${data.goals?.length || 0})</h4>
            ${(data.goals || []).map(g => `
              <div class="row">
                <span class="min">${g.minute || '??'}</span>
                <span>${g.player}</span>
                <span style="color:#8b949e">${g.team || ''}</span>
                ${g.assist ? `<span style="color:#f59e0b;font-size:0.8rem">تمريرة: ${g.assist}</span>` : ''}
              </div>
            `).join('') || '<div style="color:#8b949e">لا توجد أهداف</div>'}
          </div>
          
          <div class="card">
            <h4>🟨 البطاقات (${data.cards?.length || 0})</h4>
            ${(data.cards || []).map(c => `
              <div class="row">
                <span class="min">${c.minute || '??'}</span>
                <span class="${c.type === 'redCard' ? 'red' : 'yellow'}">${c.type === 'redCard' ? '🟥' : '🟨'}</span>
                <span>${c.player}</span>
                <span style="color:#8b949e">${c.team || ''}</span>
              </div>
            `).join('') || '<div style="color:#8b949e">لا توجد بطاقات</div>'}
          </div>
          
          <div class="card">
            <h4>🔄 التبديلات (${data.subs?.length || 0})</h4>
            ${(data.subs || []).map(s => `
              <div class="row">
                <span class="min">${s.minute || '??'}</span>
                <span class="green">▲ ${s.playerIn}</span>
                <span class="red">▼ ${s.playerOut}</span>
                <span style="color:#8b949e">${s.team || ''}</span>
              </div>
            `).join('') || '<div style="color:#8b949e">لا توجد تبديلات</div>'}
          </div>
        `;
      } catch(e) {
        document.getElementById('root').innerHTML = 'خطأ: ' + e.message;
      }
    }
    load();
  </script>
</body>
</html>
