<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>تفاصيل المباراة - Scorio</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0d1117;--bg2:#161b22;--bg3:#1f2a3e;
      --border:#30363d;--text:#e6edf3;--text2:#8b949e;
      --green:#4ade80;--red:#e63946;--blue:#58a6ff;--orange:#f97316;
    }
    body{font-family:'Segoe UI','Cairo',sans-serif;background:var(--bg);color:var(--text);max-width:650px;margin:0 auto;padding-bottom:2rem}
    .back-header{position:sticky;top:0;background:var(--bg2);padding:.8rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;z-index:100}
    .back-btn{background:none;border:none;color:var(--blue);font-size:1.2rem;cursor:pointer}
    .back-header h2{font-size:1.1rem}
    .match-hero{background:var(--bg2);padding:1rem;border-bottom:1px solid var(--border)}
    .hero-league{text-align:center;font-size:.7rem;color:var(--text2);margin-bottom:.5rem}
    .hero-teams{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.8rem 0}
    .hero-team{flex:1;text-align:center}
    .hero-logo{width:55px;height:55px;object-fit:contain;margin-bottom:.3rem}
    .hero-team-name{font-weight:800;font-size:.9rem}
    .hero-score{font-size:2rem;font-weight:900;min-width:80px;text-align:center}
    .hero-score.live{color:var(--red)}
    .hero-status{text-align:center;font-size:.7rem;color:var(--text2);margin-top:.3rem}
    .live-pill{background:var(--red);color:white;padding:.2rem .6rem;border-radius:15px;font-size:.7rem}
    .tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:55px;z-index:99}
    .tab{flex:1;padding:.7rem;text-align:center;background:none;border:none;color:var(--text2);font-weight:700;cursor:pointer;border-bottom:2.5px solid transparent}
    .tab.active{color:var(--blue);border-bottom-color:var(--blue)}
    .tab-panel{display:none;padding:.5rem 0}
    .tab-panel.active{display:block}
    .event-row{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem .8rem;border-bottom:1px solid var(--border)}
    .event-minute{min-width:40px;color:var(--text2);font-weight:800;font-size:.75rem}
    .event-icon{font-size:.9rem}
    .event-detail{flex:1}
    .event-player{font-weight:700}
    .event-team{font-size:.7rem;color:var(--text2)}
    .section-title{padding:.5rem .8rem;background:var(--bg3);font-size:.7rem;font-weight:700;color:var(--text2)}
    .stat-item{padding:.6rem .8rem;border-bottom:1px solid var(--border)}
    .stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem}
    .stat-home,.stat-away{font-weight:800;width:45px;text-align:center}
    .stat-name{flex:1;text-align:center;font-size:.75rem;color:var(--text2)}
    .stat-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:2px}
    .stat-fill-home{height:100%;background:var(--blue);float:right}
    .stat-fill-away{height:100%;background:var(--red)}
    .loading,.error{text-align:center;padding:3rem;color:var(--text2)}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ══ FORMATION SWITCHER ══ */
    .fm-switcher{display:flex;gap:.5rem;padding:.7rem .8rem;border-bottom:1px solid var(--border);background:var(--bg2)}
    .fm-btn{flex:1;padding:.45rem;border-radius:8px;background:var(--bg3);border:1.5px solid var(--border);color:var(--text2);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
    .fm-btn.active{background:var(--blue);border-color:var(--blue);color:white}

    /* ══ PITCH ══ */
    .pitch-wrap{padding:.8rem}
    .pitch{
      background:#2e8b2e;
      border:2px solid rgba(255,255,255,.4);
      border-radius:8px;
      padding:12px 8px 16px;
      position:relative;
      overflow:hidden;
      display:flex;flex-direction:column;gap:10px;
    }
    .pitch::before{
      content:'';position:absolute;inset:0;
      background:repeating-linear-gradient(180deg,rgba(0,0,0,.06) 0px,rgba(0,0,0,.06) 38px,transparent 38px,transparent 76px);
      pointer-events:none;
    }
    .pitch-line-center{position:absolute;left:8px;right:8px;top:50%;height:1px;background:rgba(255,255,255,.3);pointer-events:none}
    .pitch-circle{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:68px;height:68px;border:1.5px solid rgba(255,255,255,.3);border-radius:50%;pointer-events:none;
    }
    .pitch-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:5px;height:5px;background:rgba(255,255,255,.4);border-radius:50%;pointer-events:none}
    .pitch-box-top{
      position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:54%;height:16%;border:1.5px solid rgba(255,255,255,.25);border-top:none;border-radius:0 0 4px 4px;pointer-events:none;
    }
    .pitch-box-bottom{
      position:absolute;bottom:0;left:50%;transform:translateX(-50%);
      width:54%;height:16%;border:1.5px solid rgba(255,255,255,.25);border-bottom:none;border-radius:4px 4px 0 0;pointer-events:none;
    }
    .pitch-row{display:flex;justify-content:space-evenly;align-items:center;position:relative;z-index:1;min-height:68px}

    /* ══ PLAYER ITEM ══ */
    .player-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:default}
    .player-item .jersey-wrap{position:relative;display:flex;align-items:center;justify-content:center}
    .player-item .p-badge{
      position:absolute;top:-4px;right:-6px;
      width:14px;height:14px;border-radius:50%;
      font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:900;
    }
    .player-item .badge-yellow{background:#f59e0b;color:#000}
    .player-item .badge-red{background:#e63946;color:#fff}
    .player-item .badge-sub-in{background:#4ade80;color:#000}
    .player-item .badge-sub-out{background:#ef4444;color:#fff}
    .player-tag{
      background:rgba(0,0,0,.65);color:#fff;
      font-size:9.5px;font-weight:700;
      padding:1px 5px;border-radius:3px;
      white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis;text-align:center;
    }

    /* ══ SUBSTITUTIONS ══ */
    .subs-section{margin-top:.5rem}
    .subs-title{padding:.5rem .8rem;background:var(--bg3);font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
    .sub-row{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-bottom:1px solid var(--border)}
    .sub-jersey{width:22px;height:22px;background:var(--bg3);border-radius:4px;font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
    .sub-name{flex:1;font-size:.82rem;font-weight:700}
    .sub-arrow-in{color:#4ade80;font-size:.85rem}
    .sub-arrow-out{color:#ef4444;font-size:.85rem;margin-top:2px}
    .sub-pair{flex:1}
    .sub-in-row,.sub-out-row{display:flex;align-items:center;gap:.4rem;font-size:.78rem}
    .sub-in-row{color:#4ade80;font-weight:700}
    .sub-out-row{color:var(--text2);margin-top:2px}
    .sub-time{font-size:.72rem;color:var(--text2);margin-right:auto;flex-shrink:0}
    .no-data{text-align:center;padding:1.2rem;color:var(--text2);font-size:.82rem}
  </style>
</head>
<body>

<div class="back-header">
  <button class="back-btn" onclick="history.back()">→</button>
  <h2>تفاصيل المباراة</h2>
</div>

<div id="content">
  <div class="loading"><div class="spinner"></div>جارٍ التحميل...</div>
</div>

<script>
const WORKER_URL = 'https://football-worker.mahdijadir38.workers.dev';

/* ═══ POSITION CATEGORY ══════════════════════════════════════════════ */
function getPosCat(abbr) {
  const base = (abbr || '').toUpperCase().split('-')[0].split(' ')[0];
  if (['G','GK'].includes(base)) return 'gk';
  if (['CB','CD','LCB','RCB','LB','RB','LWB','RWB','SW','DC','DL','DR','D'].includes(base)) return 'def';
  if (['ST','CF','FW','LW','RW','SS','FO','ATT','LF','RF','FWD'].includes(base)) return 'fwd';
  return 'mid';
}

/* ═══ JERSEY SVG ═════════════════════════════════════════════════════ */
function jerseyHtml(number, isGK, fillColor) {
  const color = isGK ? '#666' : fillColor;
  const shade = isGK ? '#444' : shadeColor(fillColor, -25);
  const num   = number || '?';
  const fsize = String(num).length > 2 ? '8' : String(num).length > 1 ? '11' : '13';
  return `<svg viewBox="0 0 44 42" width="42" height="39" xmlns="http://www.w3.org/2000/svg">
    <path d="M7.5,4 L0,14 L8,18 L8,39 L36,39 L36,18 L44,14 L36.5,4 Q30,9.5 22,9.5 Q14,9.5 7.5,4 Z" fill="${color}"/>
    <path d="M7.5,4 L8,18 L12,20 Q22,23 32,20 L36,18 L36.5,4 Q30,9.5 22,9.5 Q14,9.5 7.5,4 Z" fill="${shade}" opacity=".25"/>
    <path d="M15,4.5 Q22,11 29,4.5" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
    <text x="22" y="30" text-anchor="middle" fill="white" font-size="${fsize}px" font-weight="900" font-family="Arial,sans-serif">${num}</text>
  </svg>`;
}

function shadeColor(hex, pct) {
  try {
    let c = hex.replace('#','');
    if (c.length === 3) c = c.split('').map(x=>x+x).join('');
    const n = parseInt(c,16);
    const r = Math.min(255,Math.max(0,((n>>16)&0xff)+pct));
    const g = Math.min(255,Math.max(0,((n>>8)&0xff)+pct));
    const b = Math.min(255,Math.max(0,(n&0xff)+pct));
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  } catch(e){ return hex; }
}

/* ═══ BUILD PITCH ROWS ═══════════════════════════════════════════════ */
function buildRows(starters, formation) {
  const gks      = starters.filter(p => getPosCat(p.position) === 'gk');
  const outfield = starters.filter(p => getPosCat(p.position) !== 'gk');
  const fmNums   = (formation || '').split('-').map(Number).filter(n => !isNaN(n) && n > 0);
  const total    = fmNums.reduce((a,b) => a+b, 0);

  if (fmNums.length > 0 && total === outfield.length) {
    const rows = [];
    let idx = 0;
    fmNums.forEach(n => {
      rows.push(outfield.slice(idx, idx + n));
      idx += n;
    });
    return [gks, ...rows]; // GK at bottom, FWD at top
  }

  // fallback: group by category
  const def = outfield.filter(p => getPosCat(p.position) === 'def');
  const mid = outfield.filter(p => getPosCat(p.position) === 'mid');
  const fwd = outfield.filter(p => getPosCat(p.position) === 'fwd');
  return [gks, def, mid, fwd].filter(r => r.length > 0);
}

/* ═══ RENDER PITCH ═══════════════════════════════════════════════════ */
function renderPitch(lineup, formation, teamColor) {
  const starters = lineup.filter(p => p.starter);
  const rows     = buildRows(starters, formation); // [gk, def, mid, ..., fwd]

  const pitchEl  = document.getElementById('pitch-players');
  if (!pitchEl) return;
  pitchEl.innerHTML = '';

  // Render from top (fwd) to bottom (gk) — rows array is [gk,...,fwd], reverse for display
  const display = [...rows].reverse();
  display.forEach(row => {
    if (!row.length) return;
    const rowEl = document.createElement('div');
    rowEl.className = 'pitch-row';
    row.forEach(p => {
      const isGK   = getPosCat(p.position) === 'gk';
      const badges = [];
      if (p.subbedOut) badges.push('<span class="p-badge badge-sub-out">▼</span>');
      if (p.subbedIn)  badges.push('<span class="p-badge badge-sub-in">▲</span>');
      if (p.yellowCard) badges.push('<span class="p-badge badge-yellow">■</span>');
      if (p.redCard)    badges.push('<span class="p-badge badge-red">■</span>');
      const short = p.shortName || p.name.split(' ').slice(-1)[0] || p.name;
      rowEl.innerHTML += `
        <div class="player-item">
          <div class="jersey-wrap">
            ${jerseyHtml(p.jersey, isGK, teamColor)}
            ${badges.join('')}
          </div>
          <div class="player-tag">${short}</div>
        </div>`;
    });
    pitchEl.appendChild(rowEl);
  });
}

/* ═══ RENDER SUBSTITUTIONS ════════════════════════════════════════════ */
function renderSubs(lineup, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;

  const subbedOut = lineup.filter(p => p.subbedOut);
  const subbedIn  = lineup.filter(p => p.subbedIn);

  if (!subbedOut.length && !subbedIn.length) {
    el.innerHTML = '<div class="no-data">لا توجد تبديلات</div>';
    return;
  }

  const max = Math.max(subbedOut.length, subbedIn.length);
  let html = '';
  for (let i = 0; i < max; i++) {
    const out = subbedOut[i];
    const inn = subbedIn[i];
    html += `<div class="sub-row">
      <div class="sub-pair">
        ${inn ? `<div class="sub-in-row"><span class="sub-arrow-in">▲</span>#${inn.jersey} ${inn.shortName || inn.name}</div>` : ''}
        ${out ? `<div class="sub-out-row"><span class="sub-arrow-out">▼</span>#${out.jersey} ${out.shortName || out.name}</div>` : ''}
      </div>
    </div>`;
  }
  el.innerHTML = html;
}

/* ═══ GLOBALS ════════════════════════════════════════════════════════ */
let matchData = null;

function showTeam(side) {
  if (!matchData) return;
  const isHome    = side === 'home';
  const lineup    = isHome ? matchData.homeLineup    : matchData.awayLineup;
  const formation = isHome ? matchData.homeFormation : matchData.awayFormation;
  const color     = isHome ? '#3b82f6' : '#ef4444';
  const btnHome   = document.getElementById('btn-home');
  const btnAway   = document.getElementById('btn-away');
  btnHome.classList.toggle('active', isHome);
  btnAway.classList.toggle('active', !isHome);
  renderPitch(lineup, formation, color);
  renderSubs(lineup, 'subs-list');
}

/* ═══ LOAD MATCH ══════════════════════════════════════════════════════ */
async function loadMatch() {
  const params  = new URLSearchParams(window.location.search);
  const matchId = params.get('id');
  const league  = params.get('league') || '';
  if (!matchId) {
    document.getElementById('content').innerHTML = '<div class="error">❌ معرف المباراة غير موجود</div>';
    return;
  }

  try {
    const url  = `${WORKER_URL}/api/summary?matchId=${matchId}&league=${league}`;
    const res  = await fetch(url);
    const data = await res.json();
    if (!data || data.error) throw new Error(data?.error || 'فشل التحميل');
    matchData = data;
    renderMatch(data);
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="error">❌ ${e.message}</div>`;
  }
}

/* ═══ RENDER MATCH ════════════════════════════════════════════════════ */
function renderMatch(data) {
  const isLive = data.status === 'in';
  const isPre  = data.status === 'pre';

  /* ── GOALS ── */
  const goalsHtml = (data.goals || []).map(g => `
    <div class="event-row">
      <span class="event-minute">${g.minute || ''}'</span>
      <span class="event-icon">⚽</span>
      <div class="event-detail">
        <div class="event-player">${g.player || ''}</div>
        <div class="event-team">${g.team || ''}</div>
      </div>
    </div>`).join('') || '<div class="no-data">لا توجد أهداف</div>';

  /* ── CARDS ── */
  const cardsHtml = (data.cards || []).map(c => `
    <div class="event-row">
      <span class="event-minute">${c.minute || ''}'</span>
      <span class="event-icon">${c.type?.includes('Red') ? '🟥' : '🟨'}</span>
      <div class="event-detail">
        <div class="event-player">${c.player || ''}</div>
        <div class="event-team">${c.team || ''}</div>
      </div>
    </div>`).join('') || '<div class="no-data">لا توجد بطاقات</div>';

  /* ── STATS ── */
  const statsHtml = (data.homeStats || []).map((s, i) => {
    const as = data.awayStats?.[i];
    const hv = parseFloat(s.value) || 0;
    const av = parseFloat(as?.value) || 0;
    const tot = hv + av || 1;
    const hp  = Math.round(hv / tot * 100);
    return `<div class="stat-item">
      <div class="stat-row">
        <span class="stat-home">${s.value}</span>
        <span class="stat-name">${s.name}</span>
        <span class="stat-away">${as?.value || '-'}</span>
      </div>
      <div class="stat-bar"><div class="stat-fill-home" style="width:${hp}%"></div></div>
      <div class="stat-bar"><div class="stat-fill-away" style="width:${100-hp}%"></div></div>
    </div>`;
  }).join('') || '<div class="no-data">لا توجد إحصائيات</div>';

  /* ── FORMATION LABELS ── */
  const fmHome = data.homeFormation ? ` (${data.homeFormation})` : '';
  const fmAway = data.awayFormation ? ` (${data.awayFormation})` : '';

  /* ── HERO SCORE ── */
  const scoreText = isPre
    ? '<span style="font-size:1rem;color:var(--text2)">لم تبدأ</span>'
    : `${data.homeScore ?? 0} - ${data.awayScore ?? 0}`;
  const statusText = isPre ? '⏱️ لم تبدأ' : isLive
    ? `<span class="live-pill">🔴 مباشر</span>`
    : `✅ ${data.statusText || 'انتهت'}`;

  document.getElementById('content').innerHTML = `
    <div class="match-hero">
      <div class="hero-league">${data.leagueName || ''}</div>
      <div class="hero-teams">
        <div class="hero-team">
          ${data.homeLogo ? `<img class="hero-logo" src="${data.homeLogo}" onerror="this.style.display='none'">` : '<div style="width:55px"></div>'}
          <div class="hero-team-name">${data.homeTeam}</div>
        </div>
        <div class="hero-score ${isLive ? 'live' : ''}">${scoreText}</div>
        <div class="hero-team">
          ${data.awayLogo ? `<img class="hero-logo" src="${data.awayLogo}" onerror="this.style.display='none'">` : '<div style="width:55px"></div>'}
          <div class="hero-team-name">${data.awayTeam}</div>
        </div>
      </div>
      <div class="hero-status">${statusText}</div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('events',this)">⚽ الأحداث</button>
      <button class="tab" onclick="switchTab('lineup',this)">👕 التشكيلة</button>
      <button class="tab" onclick="switchTab('stats',this)">📊 الإحصائيات</button>
    </div>

    <!-- EVENTS -->
    <div class="tab-panel active" id="panel-events">
      <div class="section-title">⚽ الأهداف</div>
      ${goalsHtml}
      <div class="section-title">🟨 البطاقات</div>
      ${cardsHtml}
    </div>

    <!-- LINEUP -->
    <div class="tab-panel" id="panel-lineup">
      <div class="fm-switcher">
        <button class="fm-btn active" id="btn-home" onclick="showTeam('home')">
          🔵 ${data.homeTeam}${fmHome}
        </button>
        <button class="fm-btn" id="btn-away" onclick="showTeam('away')">
          🔴 ${data.awayTeam}${fmAway}
        </button>
      </div>

      <div class="pitch-wrap">
        <div class="pitch">
          <div class="pitch-box-top"></div>
          <div class="pitch-line-center"></div>
          <div class="pitch-circle"></div>
          <div class="pitch-dot"></div>
          <div class="pitch-box-bottom"></div>
          <div id="pitch-players" style="display:flex;flex-direction:column;gap:10px;position:relative;z-index:1"></div>
        </div>
      </div>

      <div class="subs-section">
        <div class="subs-title">التبديلات</div>
        <div id="subs-list"></div>
      </div>
    </div>

    <!-- STATS -->
    <div class="tab-panel" id="panel-stats">
      <div class="section-title" style="display:flex;justify-content:space-between;padding:.5rem .8rem">
        <span style="color:var(--blue)">${data.homeTeam}</span>
        <span></span>
        <span style="color:var(--red)">${data.awayTeam}</span>
      </div>
      ${statsHtml}
    </div>
  `;

  /* Render pitch after DOM is ready */
  requestAnimationFrame(() => showTeam('home'));
}

/* ═══ TAB SWITCH ══════════════════════════════════════════════════════ */
function switchTab(id, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  btn.classList.add('active');
}

loadMatch();
</script>
</body>
</html>
